<div class="todos-modern-root">
  <main>
    <h2>Todos (modern)</h2>

    <div class="add-container">
      <button class="add-btn" (click)="openAddDialog($event)" (contextmenu)="openAddDialog($event)">+ Add Todo</button>
    </div>

    @if (loading_sig()) {
    <div>Loading todos…</div>
    }

    @if (todos_sig().length > 0) {
    <div class="cards">
      @for (todo of todos_sig(); track $index) {
      <article class="card">
        <div class="card-row">
          <button type="button" class="expand-btn" (click)="toggleDescription(todo.id); $event.stopPropagation()">
            {{ expanded_sig()[todo.id] ? '▾' : '▸' }}
          </button>
          <div class="card-title" [style.text-decoration]="todo.completed ? 'line-through' : 'none'">{{ todo.name }}
          </div>
        </div>

        @if (expanded_sig()[todo.id]) {
        <div class="card-desc">{{ todo.description }}</div>
        }

        <div class="card-actions">
          <label class="card-complete">
            <input type="checkbox" (click)="updateTodoCompleted(todo); $event.stopPropagation()"
              [checked]="todo.completed" />
            Completed
          </label>
          <button type="button" class="delete-btn"
            (click)="deleteTodo(todo.id); $event.stopPropagation()">Delete</button>
        </div>
      </article>
      }
    </div>
    } @else if (!loading_sig()) {
    <p>Your todo list is empty.</p>
    }

    <!-- Add form moved to modal dialog -->
  </main>
</div>
